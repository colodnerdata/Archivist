# Ollama
# Override this if Ollama is reachable on a different host, such as a WSL bridge IP.
ollama_base_url: "http://localhost:11434"
triage_model: "phi4:14b"
# summarize_model uses a larger model than the triage path because
# summarization quality is prioritized over throughput for this step.
# phi4:14b was selected as an upgrade from the previous 8B-class model
# for better long-form summary quality and instruction-following.
# This materially increases memory usage and inference time, so this
# configuration is intended only for deployments where the Ollama host
# has enough capacity to run the 14B summarizer alongside the triage
# and vision models configured below.
summarize_model: "phi4:14b"
# vision_model is used for images.
vision_model: "qwen3-vl:8b"
# vision_pdf_model is used for PDFs detected as more than plain text
# (embedded images, sparse text, charts, forms, scanned pages).
vision_pdf_model: "qwen3-vl:8b-thinking"

# Performance
triage_batch_size: 8
max_text_tokens: 2000

# Cross-drive deduplication registry
kept_hashes_path: "kept_hashes.csv"

# Optional: treat a previously scanned CSV as an authoritative baseline.
# Example: scan C first, then set this to reports/drive_c.csv before scanning D or E.
baseline_scan_csv: "reports/drive_c.csv"

# Recovery destination root
recovery_root: "/mnt/e/recovered"

# Scan exclusions
exclude_dirs:
  - "$RECYCLE.BIN"
  - "System Volume Information"
  - "Windows"
  - "Program Files"
  - "Program Files (x86)"
  - "ProgramData"
  - "AppData"
  # Windows NTFS junction points in user profiles (legacy redirects, always inaccessible)
  - "Application Data"
  - "Cookies"
  - "Local Settings"
  - "My Documents"
  - "NetHood"
  - "PrintHood"
  - "Recent"
  - "SendTo"
  - "Start Menu"
  - "Templates"
  - "My Music"
  - "My Pictures"
  - "My Videos"

exclude_extensions:
  - .exe
  - .msi
  - .dll
  - .sys
  - .tmp
  - .log
  - .ini
  - .lnk
  - .url
  - .db
  - .cache
